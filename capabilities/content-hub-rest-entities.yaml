    resources:
    - name: entities
      path: /entities
      operations:
      - name: listentities
        method: GET
        description: List entities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: definition
          in: query
          type: string
          description: Filter entities by their entity definition identifier
        - name: skip
          in: query
          type: integer
          description: Number of entities to skip for pagination
        - name: take
          in: query
          type: integer
          description: Maximum number of entities to return
        - name: culture
          in: query
          type: string
          description: Culture code for multi-lingual property values (e.g., en-US)
      - name: createentity
        method: POST
        description: Create an entity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
