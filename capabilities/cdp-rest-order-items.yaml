naftiko: 1.0.0-alpha2
info:
  label: Sitecore CDP REST API — Order Items
  description: 'Sitecore CDP REST API — Order Items. 2 operations. Lead operation: List order items. Self-contained Naftiko
    capability covering one Sitecore business surface.'
  tags:
  - Sitecore
  - Order Items
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SITECORE_API_KEY: SITECORE_API_KEY
capability:
  consumes:
  - type: http
    namespace: cdp-rest-order-items
    baseUri: https://api-engage-eu.sitecorecloud.io
    description: Sitecore CDP REST API — Order Items business capability. Self-contained, no shared references.
    resources:
    - name: v2.1-guests-guestRef-orders-orderRef-items
      path: /v2.1/guests/{guestRef}/orders/{orderRef}/items
      operations:
      - name: listorderitems
        method: GET
        description: List order items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createorderitem
        method: POST
        description: Create an order item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.SITECORE_USER}}'
      password: '{{env.SITECORE_PASS}}'
  exposes:
  - type: rest
    namespace: cdp-rest-order-items-rest
    port: 8080
    description: REST adapter for Sitecore CDP REST API — Order Items. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v2-1/guests/{guestref}/orders/{orderref}/items
      name: v2-1-guests-guestref-orders-orderref-items
      description: REST surface for v2.1-guests-guestRef-orders-orderRef-items.
      operations:
      - method: GET
        name: listorderitems
        description: List order items
        call: cdp-rest-order-items.listorderitems
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createorderitem
        description: Create an order item
        call: cdp-rest-order-items.createorderitem
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cdp-rest-order-items-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sitecore CDP REST API — Order Items. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-order-items
      description: List order items
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cdp-rest-order-items.listorderitems
      outputParameters:
      - type: object
        mapping: $.
    - name: create-order-item
      description: Create an order item
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cdp-rest-order-items.createorderitem
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
