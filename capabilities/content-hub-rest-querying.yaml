naftiko: 1.0.0-alpha2
info:
  label: Sitecore Content Hub REST API — Querying
  description: 'Sitecore Content Hub REST API — Querying. 1 operations. Lead operation: Query entities. Self-contained Naftiko
    capability covering one Sitecore business surface.'
  tags:
  - Sitecore
  - Querying
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SITECORE_API_KEY: SITECORE_API_KEY
capability:
  consumes:
  - type: http
    namespace: content-hub-rest-querying
    baseUri: https://{tenant}.stylelabs.io/api
    description: Sitecore Content Hub REST API — Querying business capability. Self-contained, no shared references.
    resources:
    - name: entities-query
      path: /entities/query
      operations:
      - name: queryentities
        method: POST
        description: Query entities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SITECORE_API_KEY}}'
  exposes:
  - type: rest
    namespace: content-hub-rest-querying-rest
    port: 8080
    description: REST adapter for Sitecore Content Hub REST API — Querying. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/entities/query
      name: entities-query
      description: REST surface for entities-query.
      operations:
      - method: POST
        name: queryentities
        description: Query entities
        call: content-hub-rest-querying.queryentities
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: content-hub-rest-querying-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sitecore Content Hub REST API — Querying. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: query-entities
      description: Query entities
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: content-hub-rest-querying.queryentities
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
