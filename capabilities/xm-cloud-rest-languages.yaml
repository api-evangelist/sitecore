naftiko: 1.0.0-alpha2
info:
  label: Sitecore XM Cloud REST API — Languages
  description: 'Sitecore XM Cloud REST API — Languages. 5 operations. Lead operation: List tenant languages. Self-contained
    Naftiko capability covering one Sitecore business surface.'
  tags:
  - Sitecore
  - Languages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SITECORE_API_KEY: SITECORE_API_KEY
capability:
  consumes:
  - type: http
    namespace: xm-cloud-rest-languages
    baseUri: https://xmapps-api.sitecorecloud.io
    description: Sitecore XM Cloud REST API — Languages business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-languages
      path: /api/v1/languages
      operations:
      - name: listlanguages
        method: GET
        description: List tenant languages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v1-languages-supported
      path: /api/v1/languages/supported
      operations:
      - name: listsupportedlanguages
        method: GET
        description: List supported languages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v1-sites-siteId-languages
      path: /api/v1/sites/{siteId}/languages
      operations:
      - name: listsitelanguages
        method: GET
        description: List site languages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: addsitelanguage
        method: POST
        description: Add a language to a site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v1-sites-siteId-languages-languageId
      path: /api/v1/sites/{siteId}/languages/{languageId}
      operations:
      - name: removesitelanguage
        method: DELETE
        description: Remove a language from a site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SITECORE_API_KEY}}'
  exposes:
  - type: rest
    namespace: xm-cloud-rest-languages-rest
    port: 8080
    description: REST adapter for Sitecore XM Cloud REST API — Languages. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v1/languages
      name: api-v1-languages
      description: REST surface for api-v1-languages.
      operations:
      - method: GET
        name: listlanguages
        description: List tenant languages
        call: xm-cloud-rest-languages.listlanguages
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/languages/supported
      name: api-v1-languages-supported
      description: REST surface for api-v1-languages-supported.
      operations:
      - method: GET
        name: listsupportedlanguages
        description: List supported languages
        call: xm-cloud-rest-languages.listsupportedlanguages
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/sites/{siteid}/languages
      name: api-v1-sites-siteid-languages
      description: REST surface for api-v1-sites-siteId-languages.
      operations:
      - method: GET
        name: listsitelanguages
        description: List site languages
        call: xm-cloud-rest-languages.listsitelanguages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: addsitelanguage
        description: Add a language to a site
        call: xm-cloud-rest-languages.addsitelanguage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/sites/{siteid}/languages/{languageid}
      name: api-v1-sites-siteid-languages-languageid
      description: REST surface for api-v1-sites-siteId-languages-languageId.
      operations:
      - method: DELETE
        name: removesitelanguage
        description: Remove a language from a site
        call: xm-cloud-rest-languages.removesitelanguage
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: xm-cloud-rest-languages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sitecore XM Cloud REST API — Languages. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-tenant-languages
      description: List tenant languages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: xm-cloud-rest-languages.listlanguages
      outputParameters:
      - type: object
        mapping: $.
    - name: list-supported-languages
      description: List supported languages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: xm-cloud-rest-languages.listsupportedlanguages
      outputParameters:
      - type: object
        mapping: $.
    - name: list-site-languages
      description: List site languages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: xm-cloud-rest-languages.listsitelanguages
      outputParameters:
      - type: object
        mapping: $.
    - name: add-language-site
      description: Add a language to a site
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: xm-cloud-rest-languages.addsitelanguage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: remove-language-site
      description: Remove a language from a site
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: xm-cloud-rest-languages.removesitelanguage
      outputParameters:
      - type: object
        mapping: $.
