naftiko: 1.0.0-alpha2
info:
  label: Sitecore Discover API — Events
  description: 'Sitecore Discover API — Events. 2 operations. Lead operation: Track a behavioral event (GET). Self-contained
    Naftiko capability covering one Sitecore business surface.'
  tags:
  - Sitecore
  - Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SITECORE_API_KEY: SITECORE_API_KEY
capability:
  consumes:
  - type: http
    namespace: discover-events
    baseUri: https://{subdomain}.rfksrv.com
    description: Sitecore Discover API — Events business capability. Self-contained, no shared references.
    resources:
    - name: api-event-1
      path: /api/event/1
      operations:
      - name: trackeventget
        method: GET
        description: Track a behavioral event (GET)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: key
          in: query
          type: string
          description: URL-encoded JSON object containing event details
          required: true
      - name: trackeventpost
        method: POST
        description: Track a behavioral event (POST)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SITECORE_API_KEY}}'
  exposes:
  - type: rest
    namespace: discover-events-rest
    port: 8080
    description: REST adapter for Sitecore Discover API — Events. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/event/1
      name: api-event-1
      description: REST surface for api-event-1.
      operations:
      - method: GET
        name: trackeventget
        description: Track a behavioral event (GET)
        call: discover-events.trackeventget
        with:
          key: rest.key
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: trackeventpost
        description: Track a behavioral event (POST)
        call: discover-events.trackeventpost
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: discover-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sitecore Discover API — Events. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: track-behavioral-event-get
      description: Track a behavioral event (GET)
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: discover-events.trackeventget
      with:
        key: tools.key
      outputParameters:
      - type: object
        mapping: $.
    - name: track-behavioral-event-post
      description: Track a behavioral event (POST)
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: discover-events.trackeventpost
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
