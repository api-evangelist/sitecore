naftiko: 1.0.0-alpha2
info:
  label: Sitecore Personalize REST API — Templates
  description: 'Sitecore Personalize REST API — Templates. 4 operations. Lead operation: List templates. Self-contained Naftiko
    capability covering one Sitecore business surface.'
  tags:
  - Sitecore
  - Templates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SITECORE_API_KEY: SITECORE_API_KEY
capability:
  consumes:
  - type: http
    namespace: personalize-rest-templates
    baseUri: https://api.boxever.com
    description: Sitecore Personalize REST API — Templates business capability. Self-contained, no shared references.
    resources:
    - name: v1-templates
      path: /v1/templates
      operations:
      - name: listtemplates
        method: GET
        description: List templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtemplate
        method: POST
        description: Create a template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-templates-id
      path: /v1/templates/{id}
      operations:
      - name: gettemplate
        method: GET
        description: Get a template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatetemplate
        method: PUT
        description: Update a template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.SITECORE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: personalize-rest-templates-rest
    port: 8080
    description: REST adapter for Sitecore Personalize REST API — Templates. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/templates
      name: v1-templates
      description: REST surface for v1-templates.
      operations:
      - method: GET
        name: listtemplates
        description: List templates
        call: personalize-rest-templates.listtemplates
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtemplate
        description: Create a template
        call: personalize-rest-templates.createtemplate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/templates/{id}
      name: v1-templates-id
      description: REST surface for v1-templates-id.
      operations:
      - method: GET
        name: gettemplate
        description: Get a template
        call: personalize-rest-templates.gettemplate
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatetemplate
        description: Update a template
        call: personalize-rest-templates.updatetemplate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: personalize-rest-templates-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sitecore Personalize REST API — Templates. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-templates
      description: List templates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: personalize-rest-templates.listtemplates
      outputParameters:
      - type: object
        mapping: $.
    - name: create-template
      description: Create a template
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: personalize-rest-templates.createtemplate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-template
      description: Get a template
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: personalize-rest-templates.gettemplate
      outputParameters:
      - type: object
        mapping: $.
    - name: update-template
      description: Update a template
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: personalize-rest-templates.updatetemplate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
