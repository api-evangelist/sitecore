naftiko: 1.0.0-alpha2
info:
  label: Sitecore Content Hub REST API — Upload
  description: 'Sitecore Content Hub REST API — Upload. 1 operations. Lead operation: Create an upload request. Self-contained
    Naftiko capability covering one Sitecore business surface.'
  tags:
  - Sitecore
  - Upload
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SITECORE_API_KEY: SITECORE_API_KEY
capability:
  consumes:
  - type: http
    namespace: content-hub-rest-upload
    baseUri: https://{tenant}.stylelabs.io/api
    description: Sitecore Content Hub REST API — Upload business capability. Self-contained, no shared references.
    resources:
    - name: upload
      path: /upload
      operations:
      - name: createuploadrequest
        method: POST
        description: Create an upload request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SITECORE_API_KEY}}'
  exposes:
  - type: rest
    namespace: content-hub-rest-upload-rest
    port: 8080
    description: REST adapter for Sitecore Content Hub REST API — Upload. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/upload
      name: upload
      description: REST surface for upload.
      operations:
      - method: POST
        name: createuploadrequest
        description: Create an upload request
        call: content-hub-rest-upload.createuploadrequest
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: content-hub-rest-upload-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sitecore Content Hub REST API — Upload. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-upload-request
      description: Create an upload request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: content-hub-rest-upload.createuploadrequest
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
