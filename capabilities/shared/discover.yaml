naftiko: "1.0.0-alpha1"

info:
  label: "Sitecore Discover API"
  description: >-
    Search and product discovery API for commerce applications, enabling search
    experiences, product listing pages, recommendation widgets, and behavioral
    event tracking.
  tags:
    - Sitecore
    - Commerce
    - Product Discovery
    - Search
    - Recommendations
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      DISCOVER_SUBDOMAIN: DISCOVER_SUBDOMAIN
      DISCOVER_API_KEY: DISCOVER_API_KEY

capability:
  consumes:
    - type: http
      namespace: discover
      baseUri: https://{{DISCOVER_SUBDOMAIN}}.rfksrv.com
      description: "Sitecore Discover search and recommendations API"
      authentication:
        type: apikey
        key: X-Api-Key
        value: "{{DISCOVER_API_KEY}}"
        placement: header
      resources:
        - name: search
          path: /search/v3/{entity}
          description: "Full-text search and faceted filtering for products"
          operations:
            - name: search-products
              method: POST
              description: "Search products with full-text and faceted filtering"
              inputParameters:
                - name: entity
                  in: path
                  type: string
                  required: true
                  description: "Entity type (e.g., content, product)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  query: "{{tools.query}}"
                  facets: "{{tools.facets}}"

        - name: recommendations
          path: /rfk/v3/recommend
          description: "Product recommendation endpoints"
          operations:
            - name: get-recommendations
              method: POST
              description: "Get personalized product recommendations"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  rfkid: "{{tools.rfkid}}"
                  n_item: "{{tools.n_item}}"

        - name: events
          path: /v3/event
          description: "Behavioral event tracking for discovery algorithms"
          operations:
            - name: track-event
              method: POST
              description: "Track a behavioral event to feed discovery algorithms"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  type: "{{tools.type}}"
                  entity_type: "{{tools.entity_type}}"
                  entity_id: "{{tools.entity_id}}"

  exposes:
    - type: rest
      port: 8105
      namespace: discover-rest-api
      resources:
        - path: /v1/search
          name: search
          operations:
            - method: POST
              name: search-products
              call: "discover.search-products"
        - path: /v1/recommendations
          name: recommendations
          operations:
            - method: POST
              name: get-recommendations
              call: "discover.get-recommendations"

    - type: mcp
      port: 9105
      namespace: discover-mcp
      transport: http
      tools:
        - name: search-products
          description: "Search products using Sitecore Discover"
          hints:
            readOnly: true
            openWorld: true
          call: "discover.search-products"
        - name: get-recommendations
          description: "Get personalized product recommendations"
          hints:
            readOnly: true
          call: "discover.get-recommendations"
        - name: track-event
          description: "Track a behavioral event for discovery personalization"
          call: "discover.track-event"
