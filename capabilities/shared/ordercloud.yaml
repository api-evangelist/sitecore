naftiko: "1.0.0-alpha1"

info:
  label: "Sitecore OrderCloud API"
  description: >-
    Headless API-first commerce platform for managing products, catalogs, orders,
    buyers, sellers, and fulfillment. Supports B2C, B2B, and B2B2C models with
    OAuth 2.0 authentication.
  tags:
    - Sitecore
    - Commerce
    - Order Management
    - B2B
    - B2C
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      ORDERCLOUD_ACCESS_TOKEN: ORDERCLOUD_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: ordercloud
      baseUri: https://api.ordercloud.io/v1
      description: "Sitecore OrderCloud headless commerce API"
      authentication:
        type: bearer
        token: "{{ORDERCLOUD_ACCESS_TOKEN}}"
      resources:
        - name: products
          path: /products
          description: "Manage commerce products and catalog items"
          operations:
            - name: list-products
              method: GET
              description: "List products in the marketplace"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: pageSize
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search term"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-product
              method: POST
              description: "Create a new product"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Name: "{{tools.Name}}"
                  Description: "{{tools.Description}}"
                  Active: "{{tools.Active}}"

        - name: orders
          path: /orders
          description: "Manage orders across buyer/seller contexts"
          operations:
            - name: list-orders
              method: GET
              description: "List orders with filtering and pagination"
              inputParameters:
                - name: direction
                  in: query
                  type: string
                  required: false
                  description: "Incoming or outgoing orders"
                - name: buyerID
                  in: query
                  type: string
                  required: false
                  description: "Filter by buyer"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Order status filter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-order
              method: POST
              description: "Create a new order"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  FromUserID: "{{tools.FromUserID}}"
                  BillingAddressID: "{{tools.BillingAddressID}}"

        - name: buyers
          path: /buyers
          description: "Manage buyer organizations"
          operations:
            - name: list-buyers
              method: GET
              description: "List buyer organizations"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-buyer
              method: POST
              description: "Create a new buyer organization"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Name: "{{tools.Name}}"
                  Active: "{{tools.Active}}"

        - name: catalogs
          path: /catalogs
          description: "Manage product catalogs"
          operations:
            - name: list-catalogs
              method: GET
              description: "List product catalogs"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8103
      namespace: ordercloud-rest-api
      resources:
        - path: /v1/products
          name: products
          operations:
            - method: GET
              name: list-products
              call: "ordercloud.list-products"
            - method: POST
              name: create-product
              call: "ordercloud.create-product"
        - path: /v1/orders
          name: orders
          operations:
            - method: GET
              name: list-orders
              call: "ordercloud.list-orders"

    - type: mcp
      port: 9103
      namespace: ordercloud-mcp
      transport: http
      tools:
        - name: list-products
          description: "List OrderCloud products"
          hints:
            readOnly: true
          call: "ordercloud.list-products"
        - name: create-product
          description: "Create a new OrderCloud product"
          call: "ordercloud.create-product"
        - name: list-orders
          description: "List OrderCloud orders"
          hints:
            readOnly: true
          call: "ordercloud.list-orders"
        - name: list-buyers
          description: "List OrderCloud buyer organizations"
          hints:
            readOnly: true
          call: "ordercloud.list-buyers"
