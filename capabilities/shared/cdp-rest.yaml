naftiko: "1.0.0-alpha1"

info:
  label: "Sitecore CDP REST API"
  description: >-
    REST API for managing guest profiles, orders, order items, and data extensions
    in the Sitecore Customer Data Platform. Authenticated via HTTP Basic Auth.
  tags:
    - Sitecore
    - Customer Data Platform
    - Guest Data
    - Personalization
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      CDP_CLIENT_KEY: CDP_CLIENT_KEY
      CDP_API_TOKEN: CDP_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: cdp-rest
      baseUri: https://api-engage-us.sitecorecloud.io
      description: "Sitecore CDP REST API for guest and order data management"
      authentication:
        type: basic
        username: "{{CDP_CLIENT_KEY}}"
        password: "{{CDP_API_TOKEN}}"
      resources:
        - name: guests
          path: /v2.1/guests
          description: "Manage guest profiles in Sitecore CDP"
          operations:
            - name: list-guests
              method: GET
              description: "List guest profiles with optional email filter"
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: false
                  description: "Filter by email address"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Max results (max 100)"
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-guest
              method: POST
              description: "Create a new guest profile"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  email: "{{tools.email}}"
                  firstName: "{{tools.firstName}}"
                  lastName: "{{tools.lastName}}"

        - name: guest
          path: /v2.1/guests/{guestRef}
          description: "Manage a specific guest profile"
          operations:
            - name: get-guest
              method: GET
              description: "Get a guest profile by reference"
              inputParameters:
                - name: guestRef
                  in: path
                  type: string
                  required: true
                  description: "The guest reference identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-guest
              method: PUT
              description: "Update a guest profile"
              inputParameters:
                - name: guestRef
                  in: path
                  type: string
                  required: true
                  description: "The guest reference identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  email: "{{tools.email}}"
                  firstName: "{{tools.firstName}}"
            - name: delete-guest
              method: DELETE
              description: "Delete a guest profile"
              inputParameters:
                - name: guestRef
                  in: path
                  type: string
                  required: true
                  description: "The guest reference identifier"

        - name: guest-orders
          path: /v2.1/guests/{guestRef}/orders
          description: "Manage orders for a guest"
          operations:
            - name: list-guest-orders
              method: GET
              description: "List orders for a specific guest"
              inputParameters:
                - name: guestRef
                  in: path
                  type: string
                  required: true
                  description: "The guest reference identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-guest-order
              method: POST
              description: "Create an order for a guest"
              inputParameters:
                - name: guestRef
                  in: path
                  type: string
                  required: true
                  description: "The guest reference identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  referenceId: "{{tools.referenceId}}"
                  status: "{{tools.status}}"
                  currencyCode: "{{tools.currencyCode}}"

  exposes:
    - type: rest
      port: 8101
      namespace: cdp-rest-api
      resources:
        - path: /v1/guests
          name: guests
          operations:
            - method: GET
              name: list-guests
              call: "cdp-rest.list-guests"
            - method: POST
              name: create-guest
              call: "cdp-rest.create-guest"

    - type: mcp
      port: 9101
      namespace: cdp-mcp
      transport: http
      tools:
        - name: list-guests
          description: "List guest profiles in Sitecore CDP"
          hints:
            readOnly: true
          call: "cdp-rest.list-guests"
        - name: get-guest
          description: "Get a specific guest profile by reference"
          hints:
            readOnly: true
          call: "cdp-rest.get-guest"
        - name: create-guest
          description: "Create a new guest profile in Sitecore CDP"
          call: "cdp-rest.create-guest"
