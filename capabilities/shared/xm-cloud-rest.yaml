naftiko: "1.0.0-alpha1"

info:
  label: "Sitecore XM Cloud REST API"
  description: >-
    REST API for managing site collections, sites, pages, languages, and publishing
    jobs within an XM Cloud tenant. Authenticated via OAuth 2.0 Bearer tokens.
  tags:
    - Sitecore
    - Content Management
    - Headless CMS
    - Digital Experience Platform
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      XM_CLOUD_API_TOKEN: XM_CLOUD_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: xm-cloud-rest
      baseUri: https://xmapps-api.sitecorecloud.io
      description: "Sitecore XM Cloud REST API for site and publishing management"
      authentication:
        type: bearer
        token: "{{XM_CLOUD_API_TOKEN}}"
      resources:
        - name: collections
          path: /api/v1/collections
          description: "Manage site collections within an XM Cloud tenant"
          operations:
            - name: list-collections
              method: GET
              description: "List all site collections in the tenant"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-collection
              method: POST
              description: "Create a new site collection"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  displayName: "{{tools.displayName}}"
            - name: validate-collection-name
              method: POST
              description: "Validate a proposed collection name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"

        - name: collection
          path: /api/v1/collections/{collectionId}
          description: "Manage a specific site collection"
          operations:
            - name: get-collection
              method: GET
              description: "Get a site collection by ID"
              inputParameters:
                - name: collectionId
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the site collection"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-collection
              method: PUT
              description: "Update a site collection"
              inputParameters:
                - name: collectionId
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the site collection"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
            - name: delete-collection
              method: DELETE
              description: "Delete a site collection"
              inputParameters:
                - name: collectionId
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the site collection"

        - name: sites
          path: /api/v1/sites
          description: "Manage sites within an XM Cloud tenant"
          operations:
            - name: list-sites
              method: GET
              description: "List all sites in the tenant"
              inputParameters:
                - name: collectionId
                  in: query
                  type: string
                  required: false
                  description: "Filter sites by collection"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-site
              method: POST
              description: "Create a new site"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  collectionId: "{{tools.collectionId}}"
                  language: "{{tools.language}}"

        - name: site
          path: /api/v1/sites/{siteId}
          description: "Manage a specific site"
          operations:
            - name: get-site
              method: GET
              description: "Get a site by ID"
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the site"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-site
              method: DELETE
              description: "Delete a site"
              inputParameters:
                - name: siteId
                  in: path
                  type: string
                  required: true
                  description: "The unique identifier of the site"

        - name: pages
          path: /api/v1/pages
          description: "Manage pages within an XM Cloud site"
          operations:
            - name: list-pages
              method: GET
              description: "List pages for a site"
              inputParameters:
                - name: siteId
                  in: query
                  type: string
                  required: false
                  description: "Filter by site"
                - name: language
                  in: query
                  type: string
                  required: false
                  description: "Language code"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-page
              method: POST
              description: "Create a new page in a site"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  siteId: "{{tools.siteId}}"
                  parentId: "{{tools.parentId}}"
                  templateId: "{{tools.templateId}}"
                  language: "{{tools.language}}"

        - name: publishing-jobs
          path: /authoring/publishing/v1/jobs
          description: "Manage content publishing jobs"
          operations:
            - name: list-publishing-jobs
              method: GET
              description: "List publishing jobs for the tenant"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by job status"
                - name: pageSize
                  in: query
                  type: integer
                  required: false
                  description: "Number of jobs per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-publishing-job
              method: POST
              description: "Create and queue a publishing job"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  targetId: "{{tools.targetId}}"
                  itemIds: "{{tools.itemIds}}"
                  languages: "{{tools.languages}}"

  exposes:
    - type: rest
      port: 8100
      namespace: xm-cloud-rest-api
      resources:
        - path: /v1/collections
          name: collections
          operations:
            - method: GET
              name: list-collections
              call: "xm-cloud-rest.list-collections"
            - method: POST
              name: create-collection
              call: "xm-cloud-rest.create-collection"

    - type: mcp
      port: 9100
      namespace: xm-cloud-mcp
      transport: http
      tools:
        - name: list-collections
          description: "List all XM Cloud site collections"
          hints:
            readOnly: true
          call: "xm-cloud-rest.list-collections"
        - name: create-collection
          description: "Create a new XM Cloud site collection"
          call: "xm-cloud-rest.create-collection"
