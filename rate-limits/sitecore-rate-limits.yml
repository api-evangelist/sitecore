specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: sitecore
providerId: sitecore
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Content Management
  - Digital Experience
  - DXP
  - Rate Limiting
description: Sitecore's commercial product rate limits (XM Cloud, OrderCloud, CDP, Personalize, etc.)
  are published only inside the per-product authenticated documentation portals. The public marketing
  surface does not enumerate numeric request-rate caps. This artifact is a placeholder until the
  per-product docs are fetched.
sources:
  - https://www.sitecore.com/products
notes: |
  Sitecore product documentation (doc.sitecore.com, ordercloud.io docs) is the authoritative source
  for per-product limits. Numeric caps were not retrievable from public surfaces at reconciliation
  time.
responseCodes:
  throttled: 429
limits:
  - name: Per-Product Throttling
    scope: tenant
    metric: varies
    limit: 'see per-product Sitecore documentation'
    notes: Each Sitecore product (XM Cloud, OrderCloud, CDP, etc.) defines its own rate limits in
      its dedicated documentation portal.
policies:
  - name: Per-Product Documentation
    description: Sitecore does not publish a unified rate-limit policy; consumers must consult the
      documentation for the specific product (XM Cloud, OrderCloud, CDP, Personalize, Send).
  - name: Backoff
    description: On 429 responses, clients should implement exponential backoff with jitter and
      honor any Retry-After header returned by the specific Sitecore service.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
