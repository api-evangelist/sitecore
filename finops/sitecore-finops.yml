meters:
  - name: contracted_subscription
    description: Annual contracted subscription fee per Sitecore product on the order form.
    unit: varies
    aggregation: sum
    dimensions:
      - product
  - name: managed_cloud_capacity
    description: Sitecore Managed Cloud capacity (environments, regions) negotiated on the order form.
    unit: varies
    aggregation: max
    dimensions:
      - product
      - region
  - name: ordercloud_transactions
    description: OrderCloud commerce transactions; negotiated as contract volume.
    unit: transaction
    aggregation: sum
    dimensions:
      - environment
principles:
  - name: Visibility
    description: Pull usage telemetry from each Sitecore product's admin (XM Cloud Portal, OrderCloud
      Portal, CDP / Personalize dashboards) since there is no unified consumption export.
  - name: Allocation
    description: Allocate Sitecore spend per product / per brand, matching the order form line items
      to the consuming digital property or business unit.
  - name: Optimization
    description: Optimization is contractual rather than dynamic — negotiate environment counts,
      managed-cloud regions, and AI agent usage at renewal based on observed activity.
  - name: Accountability
    description: Digital experience program owner reconciles monthly product telemetry against the
      annual contract and signs off on renewal scope.
