- aid: sitecore:xm-cloud-graphql-delivery-api
  name: Sitecore XM Cloud GraphQL Delivery API
  tags:
  - Content Delivery
  - Digital Experience Platform
  - GraphQL
  - Headless CMS
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://edge.sitecorecloud.io/api/graphql
  humanURL: https://doc.sitecore.com/xmc/en/developers/xm-cloud/delivery-api.html
  properties:
  - url: https://doc.sitecore.com/xmc/en/developers/xm-cloud/delivery-api.html
    type: Documentation
  - url: graphql/sitecore-graphql.md
    type: GraphQL
  description: >-
    The Sitecore XM Cloud GraphQL Delivery API provides access to approved and published content from
    Sitecore XM Cloud via a GraphQL endpoint optimized for production delivery. Developers use this API
    to query content items, fields, and relationships with precise control over the data returned in each
    request, reducing over-fetching in front-end applications. The API is authenticated via API keys and
    is designed for high availability and performance at scale.
- aid: sitecore:xm-cloud-authoring-management-graphql-api
  name: Sitecore XM Cloud Authoring and Management GraphQL API
  tags:
  - Content Management
  - Digital Experience Platform
  - GraphQL
  - Headless CMS
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://edge.sitecorecloud.io/api/graphql
  humanURL: >-
    https://doc.sitecore.com/xmc/en/developers/xm-cloud/sitecore-authoring-and-management-graphql-api.html
  properties:
  - url: >-
      https://doc.sitecore.com/xmc/en/developers/xm-cloud/sitecore-authoring-and-management-graphql-api.html
    type: Documentation
  description: >-
    The Sitecore XM Cloud Authoring and Management GraphQL API provides a single GraphQL endpoint and
    schema for managing Sitecore content programmatically. It supports creating, updating, and querying
    content items, templates, and site structures within an XM Cloud environment. This API is intended
    for integration builders, content migration tools, and CI/CD pipelines that need to automate content
    operations against an XM Cloud instance.
- aid: sitecore:cdp-stream-api
  name: Sitecore CDP Stream API
  tags:
  - Behavioral Data
  - Customer Data Platform
  - Event Tracking
  - Real-Time
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api-engage-us.sitecorecloud.io
  humanURL: https://doc.sitecore.com/cdp/en/developers/api/stream-api.html
  properties:
  - url: https://doc.sitecore.com/cdp/en/developers/api/stream-api.html
    type: Documentation
  - type: AsyncAPI
    url: asyncapi/sitecore-cdp-stream-api-asyncapi.yml
  description: >-
    The Sitecore CDP Stream API enables applications to send real-time behavioral and transactional events
    about users to the Sitecore Customer Data Platform. It is designed for high-throughput event ingestion
    from web, mobile, and server-side applications, capturing interactions such as page views, product
    views, and purchases. Events sent through the Stream API update guest profiles in near real-time,
    powering personalization and segmentation use cases.
- aid: sitecore:cdp-batch-api
  name: Sitecore CDP Batch API
  tags:
  - Batch Processing
  - Customer Data Platform
  - Data Import
  - Guest Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api-engage-us.sitecorecloud.io
  humanURL: https://doc.sitecore.com/cdp/en/developers/api/index-en.html
  properties:
  - url: https://doc.sitecore.com/cdp/en/developers/api/index-en.html
    type: Documentation
  description: >-
    The Sitecore CDP Batch API supports uploading large volumes of guest data and offline order records
    into Sitecore Customer Data Platform. It is intended for bulk data migration, historical data ingestion,
    and scenarios where real-time streaming is not practical, such as nightly data syncs from CRM or ERP
    systems. The API accepts structured data files and processes them asynchronously, updating guest profiles
    and order histories in CDP.
